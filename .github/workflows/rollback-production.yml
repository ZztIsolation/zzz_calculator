name: Rollback production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Confirm rollback to the server-recorded previous release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  authorize:
    name: authorize rollback request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy_sha: ${{ steps.authorize.outputs.deploy_sha }}
      requested_by: ${{ steps.authorize.outputs.requested_by }}
      triggering_actor: ${{ steps.authorize.outputs.triggering_actor }}
    steps:
      - name: Validate explicit owner rollback request
        id: authorize
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          CONFIRM_ROLLBACK: ${{ inputs.confirm }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const fail = message => {
              core.setFailed(message);
              return null;
            };
            const owner = context.repo.owner.toLowerCase();
            const requestedBy = (context.actor || "").toLowerCase();
            const triggeringActor = (process.env.TRIGGERING_ACTOR || "").toLowerCase();
            if (requestedBy !== owner || triggeringActor !== owner) {
              return fail("Rollback production may only be dispatched or re-run by the repository owner.");
            }
            if (process.env.CONFIRM_ROLLBACK !== "true") {
              return fail("confirm must be true before rolling back production.");
            }
            if (context.ref !== "refs/heads/deploy") {
              return fail("Rollback production must be dispatched from deploy.");
            }
            const deploy = (await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "deploy",
            })).data;
            if (!deploy.protected) {
              return fail("deploy must remain protected before rolling back production.");
            }
            if (context.sha !== deploy.commit.sha) {
              return fail(`Workflow SHA ${context.sha} is not current deploy ${deploy.commit.sha}.`);
            }
            core.setOutput("deploy_sha", deploy.commit.sha);
            core.setOutput("requested_by", context.actor);
            core.setOutput("triggering_actor", process.env.TRIGGERING_ACTOR);
            await core.summary
              .addHeading("Rollback authorization")
              .addRaw(`Owner ${context.actor} confirmed rollback while deploy was ${deploy.commit.sha}.`)
              .write();

  rollback:
    name: rollback to previous release
    needs: authorize
    if: needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    steps:
      - name: Initialize rollback evidence
        env:
          EXPECTED_DEPLOY_SHA: ${{ needs.authorize.outputs.deploy_sha }}
          REQUESTED_BY: ${{ needs.authorize.outputs.requested_by }}
          TRIGGERING_ACTOR: ${{ needs.authorize.outputs.triggering_actor }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'workflow_run_id=%s\nworkflow_run_attempt=%s\nworkflow_sha=%s\nrelease_branch=deploy\nexpected_deploy_sha=%s\nrequested_by=%s\ntriggering_actor=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$EXPECTED_DEPLOY_SHA" \
            "$REQUESTED_BY" "$TRIGGERING_ACTOR" > "$RUNNER_TEMP/rollback-output.txt"

      - name: Configure restricted SSH host verification
        env:
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROD_KNOWN_HOSTS"
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"

      - name: Roll back, verify, and restore original on failure
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DEPLOY_SHA: ${{ needs.authorize.outputs.deploy_sha }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_URL: ${{ vars.PROD_URL }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_file="$RUNNER_TEMP/rollback-output.txt"
          key_file=""
          cleanup() {
            local exit_code="$?"
            trap - EXIT
            if [[ -n "$key_file" && -f "$key_file" ]]; then
              shred -u -- "$key_file" 2>/dev/null || rm -f -- "$key_file"
            fi
            exit "$exit_code"
          }
          trap cleanup EXIT
          exec > >(tee -a "$evidence_file") 2>&1

          test -n "$GH_TOKEN"
          test -n "$EXPECTED_DEPLOY_SHA"
          test -n "$PROD_HOST"
          test -n "$PROD_USER"
          test -n "$PROD_SSH_PRIVATE_KEY"
          test -n "$PROD_URL"
          [[ "$PROD_URL" == https://* ]]
          base="${PROD_URL%/}"

          assert_deploy_current() {
            local branch_json live_deploy
            branch_json="$(curl --fail --silent --show-error --max-time 15 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/deploy")"
            jq -e '.protected == true' <<< "$branch_json" > /dev/null || {
              echo "deploy branch protection is not active; restart this rollback operation."
              return 1
            }
            live_deploy="$(jq -er '.commit.sha' <<< "$branch_json")"
            if [[ "$live_deploy" != "$EXPECTED_DEPLOY_SHA" ]]; then
              echo "deploy advanced to $live_deploy; restart this rollback operation."
              return 1
            fi
          }

          extract_hashed_refs() {
            local index_file="$1"
            local output_file="$2"
            grep -Eo '(src|href)="[^"]+"' "$index_file" \
              | sed -E 's/^(src|href)="([^"]+)"$/\2/' \
              | grep -E '^/static/app/[A-Za-z0-9._/-]+-[A-Za-z0-9_-]{8,}\.(js|css)$' \
              | sort -u > "$output_file" || return 1
            [[ -s "$output_file" ]]
          }

          verify_cached_chunks() {
            local list_file="$1"
            local label="$2"
            local path headers counter=0
            while IFS= read -r path; do
              [[ "$path" =~ ^/static/app/[A-Za-z0-9._/-]+-[A-Za-z0-9_-]{8,}\.(js|css)$ ]] || return 1
              counter=$((counter + 1))
              headers="$RUNNER_TEMP/${label}-chunk-${counter}.headers"
              curl --fail --silent --show-error --max-time 15 --retry 2 --retry-delay 2 \
                -D "$headers" -o /dev/null "$base$path" || return 1
              grep -Eiq '^cache-control:.*public' "$headers" || return 1
              grep -Eiq '^cache-control:.*immutable' "$headers" || return 1
            done < "$list_file"
            [[ "$counter" -gt 0 ]]
          }

          fetch_public_snapshot() {
            local prefix="$1"
            local path
            curl --fail --silent --show-error --max-time 15 --retry 2 --retry-delay 2 \
              -D "$RUNNER_TEMP/${prefix}-home.headers" -o "$RUNNER_TEMP/${prefix}-index.html" "$base/" || return 1
            grep -Eiq '^cache-control:[[:space:]]*no-store' "$RUNNER_TEMP/${prefix}-home.headers" || return 1
            for path in /discs /settings /api/health /api/catalog /api/app-config; do
              curl --fail --silent --show-error --max-time 15 --retry 2 --retry-delay 2 \
                "$base$path" > /dev/null || return 1
            done
            curl --fail --silent --show-error --max-time 15 --retry 2 --retry-delay 2 \
              "$base/downloads/zzz-scanner/manifest.json" > "$RUNNER_TEMP/${prefix}-scanner-manifest.json" || return 1
            curl --fail --silent --show-error --max-time 15 --retry 2 --retry-delay 2 \
              "$base/downloads/zzz-scanner/helper-manifest.json" > "$RUNNER_TEMP/${prefix}-helper-manifest.json" || return 1
            extract_hashed_refs "$RUNNER_TEMP/${prefix}-index.html" "$RUNNER_TEMP/${prefix}-index-chunks.txt" || return 1
          }

          verify_rollback_public() {
            fetch_public_snapshot rollback || return 1
            [[ "$(sha256sum "$RUNNER_TEMP/rollback-scanner-manifest.json" | awk '{print $1}')" == "$scanner_manifest_before" ]] || return 1
            [[ "$(sha256sum "$RUNNER_TEMP/rollback-helper-manifest.json" | awk '{print $1}')" == "$helper_manifest_before" ]] || return 1
            verify_cached_chunks "$RUNNER_TEMP/before-index-chunks.txt" original || return 1
            verify_cached_chunks "$RUNNER_TEMP/rollback-index-chunks.txt" rollback || return 1
          }

          verify_original_restored() {
            fetch_public_snapshot restored || return 1
            [[ "$(sha256sum "$RUNNER_TEMP/restored-index.html" | awk '{print $1}')" == "$index_before" ]] || return 1
            [[ "$(sha256sum "$RUNNER_TEMP/restored-scanner-manifest.json" | awk '{print $1}')" == "$scanner_manifest_before" ]] || return 1
            [[ "$(sha256sum "$RUNNER_TEMP/restored-helper-manifest.json" | awk '{print $1}')" == "$helper_manifest_before" ]] || return 1
            verify_cached_chunks "$RUNNER_TEMP/before-index-chunks.txt" restored || return 1
          }

          fetch_public_snapshot before
          index_before="$(sha256sum "$RUNNER_TEMP/before-index.html" | awk '{print $1}')"
          scanner_manifest_before="$(sha256sum "$RUNNER_TEMP/before-scanner-manifest.json" | awk '{print $1}')"
          helper_manifest_before="$(sha256sum "$RUNNER_TEMP/before-helper-manifest.json" | awk '{print $1}')"

          key_file="$(mktemp "$RUNNER_TEMP/ssh/rollback_key.XXXXXX")"
          (umask 077; printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$key_file")
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" > /dev/null
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o RequestTTY=no -o ForwardAgent=no -o ClearAllForwardings=yes)

          assert_deploy_current
          if ! ssh "${ssh_opts[@]}" "$PROD_USER@$PROD_HOST" \
            sudo -n /usr/local/sbin/zzz-calculator-deploy rollback --previous; then
            echo "Rollback command failed; verifying that the original release remains healthy."
            verify_original_restored || true
            exit 1
          fi

          if ! verify_rollback_public || ! assert_deploy_current; then
            echo "Rollback target or deploy ref failed verification; restoring the now-recorded previous release."
            restore_status=0
            ssh "${ssh_opts[@]}" "$PROD_USER@$PROD_HOST" \
              sudo -n /usr/local/sbin/zzz-calculator-deploy rollback --previous \
              || restore_status="$?"
            if [[ "$restore_status" -ne 0 ]]; then
              echo "Original release restore command failed with exit code $restore_status."
              exit 1
            fi
            if ! verify_original_restored; then
              echo "Original release was selected, but public restoration verification failed."
              exit 1
            fi
            echo "Original release was restored after rollback verification failure."
            exit 1
          fi
          echo "Rollback and public verification succeeded."

      - name: Upload rollback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-rollback-${{ github.run_id }}
          path: ${{ runner.temp }}/rollback-output.txt
          if-no-files-found: error
          retention-days: 14
