name: Promote deploy

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact current main commit SHA to promote
        required: true
        type: string
      confirm_production:
        description: Confirm that this exact SHA should be promoted to production
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-promotion-write
  cancel-in-progress: false

jobs:
  eligibility:
    name: promotion eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.validate.outputs.candidate_sha }}
      deploy_sha: ${{ steps.validate.outputs.deploy_sha }}
      ci_run_id: ${{ steps.validate.outputs.ci_run_id }}
      artifact_name: ${{ steps.validate.outputs.artifact_name }}
      requested_by: ${{ steps.validate.outputs.requested_by }}
      promotion_run_id: ${{ steps.validate.outputs.promotion_run_id }}
    steps:
      - name: Validate explicit promotion candidate
        id: validate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          REQUESTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          REQUESTED_BY: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PRODUCTION_CD_ENABLED: ${{ vars.PRODUCTION_CD_ENABLED }}
        with:
          script: |
            const fail = message => {
              core.setFailed(message);
              return null;
            };
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const owner = context.repo.owner;
            const requestedBy = process.env.REQUESTED_BY ?? "";
            const triggeringActor = process.env.TRIGGERING_ACTOR ?? "";
            const candidateSha = process.env.REQUESTED_CANDIDATE_SHA ?? "";
            const sameLogin = (left, right) => left.toLowerCase() === right.toLowerCase();

            if (context.eventName !== "workflow_dispatch" || context.ref !== "refs/heads/main") {
              return fail("Promote deploy must be explicitly dispatched from main.");
            }
            if (!sameLogin(requestedBy, owner) || !sameLogin(triggeringActor, owner)) {
              return fail("Only the repository owner may request or re-run a production promotion.");
            }
            if (process.env.CONFIRM_PRODUCTION !== "true") {
              return fail("confirm_production must be explicitly enabled.");
            }
            if (process.env.PRODUCTION_CD_ENABLED !== "true") {
              return fail("Repository variable PRODUCTION_CD_ENABLED must be true before promotion.");
            }
            if (!/^[0-9a-f]{40}$/.test(candidateSha)) {
              return fail("candidate_sha must be a full lowercase 40-character commit SHA.");
            }
            if (context.sha !== candidateSha) {
              return fail(`The requested candidate ${candidateSha} is not the dispatched main SHA ${context.sha}.`);
            }

            const getBranch = branch => github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch,
            }).then(response => response.data);
            const assertCandidateOnMain = async mainSha => {
              if (mainSha === candidateSha) return true;
              const comparison = (await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: candidateSha,
                head: mainSha,
              })).data;
              if (comparison.status !== "ahead" || comparison.ahead_by < 1) {
                return fail(`Candidate ${candidateSha} is no longer an ancestor of current main ${mainSha}.`);
              }
              return true;
            };
            const [main, deploy] = await Promise.all([
              getBranch("main"),
              getBranch("deploy"),
            ]);
            if (!main.protected || !deploy.protected) {
              return fail("Both main and deploy must be protected before promotion.");
            }
            if (!await assertCandidateOnMain(main.commit.sha)) return;
            if (deploy.commit.sha === candidateSha) {
              return fail("deploy already points at the requested candidate; use Resume deploy for a failed production retry.");
            }
            const deployComparison = (await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: deploy.commit.sha,
              head: candidateSha,
            })).data;
            if (deployComparison.status !== "ahead" || deployComparison.ahead_by < 1) {
              return fail("The requested candidate is not a non-forced fast-forward of deploy.");
            }

            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              branch: "main",
              head_sha: candidateSha,
              status: "success",
              per_page: 100,
            });
            const run = runs.data.workflow_runs.find(candidate =>
              candidate.name === "CI"
              && candidate.path === ".github/workflows/ci.yml"
              && ["push", "workflow_dispatch"].includes(candidate.event)
              && candidate.head_branch === "main"
              && candidate.head_sha === candidateSha
              && candidate.conclusion === "success"
              && candidate.head_repository?.full_name === repository
            );
            if (!run) {
              return fail(`No successful main CI run exists for ${candidateSha}.`);
            }
            const getArtifacts = () => github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              },
            );
            const artifactName = `server-release-${candidateSha}`;
            let artifacts = await getArtifacts();
            let artifact = artifacts.find(candidate =>
              candidate.name === artifactName
              && !candidate.expired
              && candidate.size_in_bytes > 0);
            if (!artifact) {
              return fail(`The exact main CI artifact ${artifactName} is missing, empty, or expired.`);
            }

            const [latestMain, latestDeploy] = await Promise.all([
              getBranch("main"),
              getBranch("deploy"),
            ]);
            if (!latestMain.protected || !latestDeploy.protected
              || latestDeploy.commit.sha !== deploy.commit.sha) {
              return fail("deploy protection or its frozen base changed during eligibility validation.");
            }
            if (!await assertCandidateOnMain(latestMain.commit.sha)) return;
            artifacts = await getArtifacts();
            artifact = artifacts.find(candidate =>
              candidate.name === artifactName
              && !candidate.expired
              && candidate.size_in_bytes > 0);
            if (!artifact) {
              return fail(`The exact main CI artifact ${artifactName} disappeared during eligibility validation.`);
            }

            core.setOutput("candidate_sha", candidateSha);
            core.setOutput("deploy_sha", deploy.commit.sha);
            core.setOutput("ci_run_id", String(run.id));
            core.setOutput("artifact_name", artifactName);
            core.setOutput("requested_by", requestedBy);
            core.setOutput("promotion_run_id", String(context.runId));
            core.info(`eligible: requested_by=${requestedBy} candidate=${candidateSha} current_main=${latestMain.commit.sha} deploy=${deploy.commit.sha} ci_run=${run.id} artifact=${artifactName}`);

  promote:
    name: promote fast-forward
    needs: eligibility
    if: >-
      needs.eligibility.result == 'success' &&
      inputs.confirm_production == true &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      candidate_sha: ${{ steps.promote.outputs.candidate_sha }}
      previous_deploy_sha: ${{ steps.promote.outputs.previous_deploy_sha }}
      ci_run_id: ${{ steps.promote.outputs.ci_run_id }}
      artifact_name: ${{ steps.promote.outputs.artifact_name }}
      promotion_run_id: ${{ steps.promote.outputs.promotion_run_id }}
      requested_by: ${{ steps.promote.outputs.requested_by }}
    steps:
      - name: Mint deploy promoter token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.DEPLOY_PROMOTER_APP_ID }}
          private-key: ${{ secrets.DEPLOY_PROMOTER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-contents: write

      - name: Validate explicit request and fast-forward deploy
        id: promote
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PREFLIGHT_CANDIDATE_SHA: ${{ needs.eligibility.outputs.candidate_sha }}
          PREFLIGHT_DEPLOY_SHA: ${{ needs.eligibility.outputs.deploy_sha }}
          PREFLIGHT_CI_RUN_ID: ${{ needs.eligibility.outputs.ci_run_id }}
          PREFLIGHT_ARTIFACT_NAME: ${{ needs.eligibility.outputs.artifact_name }}
          PREFLIGHT_REQUESTED_BY: ${{ needs.eligibility.outputs.requested_by }}
          PREFLIGHT_PROMOTION_RUN_ID: ${{ needs.eligibility.outputs.promotion_run_id }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          REQUESTED_BY: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          PROMOTER_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          PROMOTER_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          PRODUCTION_CD_ENABLED: ${{ vars.PRODUCTION_CD_ENABLED }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fail = message => {
              core.setFailed(message);
              return null;
            };
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const owner = context.repo.owner;
            const requestedBy = process.env.REQUESTED_BY ?? "";
            const triggeringActor = process.env.TRIGGERING_ACTOR ?? "";
            const candidateSha = process.env.PREFLIGHT_CANDIDATE_SHA ?? "";
            const expectedDeploySha = process.env.PREFLIGHT_DEPLOY_SHA ?? "";
            const expectedCiRunId = process.env.PREFLIGHT_CI_RUN_ID ?? "";
            const expectedArtifactName = process.env.PREFLIGHT_ARTIFACT_NAME ?? "";
            const expectedPromotionRunId = process.env.PREFLIGHT_PROMOTION_RUN_ID ?? "";
            const promoterInstallationId = process.env.PROMOTER_INSTALLATION_ID ?? "";
            const promoterAppSlug = process.env.PROMOTER_APP_SLUG ?? "";
            const sameLogin = (left, right) => left.toLowerCase() === right.toLowerCase();

            if (context.eventName !== "workflow_dispatch" || context.ref !== "refs/heads/main") {
              return fail("Promote deploy must be explicitly dispatched from main.");
            }
            if (!sameLogin(requestedBy, owner)
              || !sameLogin(triggeringActor, owner)
              || !sameLogin(process.env.PREFLIGHT_REQUESTED_BY ?? "", owner)) {
              return fail("Only the repository owner may request or re-run a production promotion.");
            }
            if (process.env.CONFIRM_PRODUCTION !== "true") {
              return fail("confirm_production must be explicitly enabled.");
            }
            if (process.env.PRODUCTION_CD_ENABLED !== "true") {
              return fail("Repository variable PRODUCTION_CD_ENABLED must be true before promotion.");
            }
            if (!/^[0-9a-f]{40}$/.test(candidateSha)
              || !/^[0-9a-f]{40}$/.test(expectedDeploySha)
              || !/^\d+$/.test(expectedCiRunId)
              || expectedArtifactName !== `server-release-${candidateSha}`
              || expectedPromotionRunId !== String(context.runId)
              || !/^\d+$/.test(promoterInstallationId)
              || !promoterAppSlug
              || context.sha !== candidateSha) {
              return fail("Promotion eligibility outputs are missing, stale, or invalid.");
            }

            const getBranch = branch => github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch,
            }).then(response => response.data);
            const assertCandidateOnMain = async mainSha => {
              if (mainSha === candidateSha) return true;
              const comparison = (await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: candidateSha,
                head: mainSha,
              })).data;
              if (comparison.status !== "ahead" || comparison.ahead_by < 1) {
                return fail(`Candidate ${candidateSha} is no longer an ancestor of current main ${mainSha}.`);
              }
              return true;
            };
            const [main, deploy] = await Promise.all([
              getBranch("main"),
              getBranch("deploy"),
            ]);
            if (!main.protected || !deploy.protected) {
              return fail("Both main and deploy must remain protected before promotion.");
            }
            if (deploy.commit.sha !== expectedDeploySha) {
              return fail(`deploy advanced to ${deploy.commit.sha}; dispatch a new promotion request.`);
            }
            if (!await assertCandidateOnMain(main.commit.sha)) return;
            const deployComparison = (await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: deploy.commit.sha,
              head: candidateSha,
            })).data;
            if (deployComparison.status !== "ahead" || deployComparison.ahead_by < 1) {
              return fail("The requested candidate cannot be promoted with a non-forced fast-forward.");
            }

            const run = (await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(expectedCiRunId),
            })).data;
            if (String(run.id) !== expectedCiRunId
              || run.name !== "CI"
              || run.path !== ".github/workflows/ci.yml"
              || !["push", "workflow_dispatch"].includes(run.event)
              || run.head_branch !== "main"
              || run.head_sha !== candidateSha
              || run.conclusion !== "success"
              || run.head_repository?.full_name !== repository) {
              return fail(`CI run ${expectedCiRunId} is not the frozen successful main run for ${candidateSha}.`);
            }
            const getArtifacts = () => github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              },
            );
            let artifacts = await getArtifacts();
            let artifact = artifacts.find(candidate =>
              candidate.name === expectedArtifactName
              && !candidate.expired
              && candidate.size_in_bytes > 0);
            if (!artifact) {
              return fail(`The exact main CI artifact ${expectedArtifactName} is missing, empty, or expired.`);
            }

            const [finalMain, finalDeploy] = await Promise.all([
              getBranch("main"),
              getBranch("deploy"),
            ]);
            if (!finalMain.protected || !finalDeploy.protected
              || finalDeploy.commit.sha !== expectedDeploySha) {
              return fail("main/deploy protection or the frozen deploy base changed during promotion validation.");
            }
            if (!await assertCandidateOnMain(finalMain.commit.sha)) return;
            artifacts = await getArtifacts();
            artifact = artifacts.find(candidate =>
              candidate.name === expectedArtifactName
              && !candidate.expired
              && candidate.size_in_bytes > 0);
            if (!artifact) {
              return fail(`The exact main CI artifact ${expectedArtifactName} disappeared before promotion.`);
            }

            let updated;
            try {
              updated = (await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "heads/deploy",
                sha: candidateSha,
                force: false,
              })).data;
            } catch (error) {
              if ([409, 422].includes(error.status)) {
                return fail("deploy rejected the non-forced update; verify its ruleset and dispatch a new promotion request.");
              }
              throw error;
            }
            const liveDeploy = await getBranch("deploy");
            if (updated.object?.sha !== candidateSha || liveDeploy.commit.sha !== candidateSha) {
              return fail(`deploy did not settle on the requested candidate ${candidateSha}.`);
            }

            core.setOutput("candidate_sha", candidateSha);
            core.setOutput("previous_deploy_sha", expectedDeploySha);
            core.setOutput("ci_run_id", String(run.id));
            core.setOutput("artifact_name", expectedArtifactName);
            core.setOutput("promotion_run_id", String(context.runId));
            core.setOutput("requested_by", requestedBy);
            const evidence = {
              schemaVersion: 2,
              repository,
              authorization: {
                type: "workflow_dispatch",
                requestedBy,
                triggeringActor,
                repositoryOwner: owner,
                workflowRunId: context.runId,
                workflowRunAttempt: Number(process.env.RUN_ATTEMPT),
                workflowRef: process.env.WORKFLOW_REF,
                requestedCandidateSha: candidateSha,
              },
              promoter: {
                appSlug: promoterAppSlug,
                installationId: Number(promoterInstallationId),
              },
              previousDeploySha: expectedDeploySha,
              candidateSha,
              resultingDeploySha: liveDeploy.commit.sha,
              mainShaAtPromotion: finalMain.commit.sha,
              mainAdvancedBeyondCandidate: finalMain.commit.sha !== candidateSha,
              mainCiRunId: run.id,
              mainCiRunUrl: run.html_url,
              artifactName: expectedArtifactName,
              artifactId: artifact.id,
              updateMode: "fast-forward",
              force: false,
              promotedAt: new Date().toISOString(),
            };
            const fs = require("fs");
            const path = require("path");
            fs.writeFileSync(
              path.join(process.env.RUNNER_TEMP, "promotion-evidence.json"),
              `${JSON.stringify(evidence, null, 2)}\n`,
              { encoding: "utf8", mode: 0o600 },
            );
            await core.summary
              .addHeading("Deploy promotion")
              .addRaw(`${requestedBy} explicitly fast-forwarded deploy from ${expectedDeploySha} to ${candidateSha}.`)
              .addRaw(` Main at promotion: ${finalMain.commit.sha}. CI run: ${run.id}. Artifact: ${expectedArtifactName}.`)
              .write();

      - name: Upload promotion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-promotion-${{ steps.promote.outputs.candidate_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/promotion-evidence.json
          if-no-files-found: error
          retention-days: 14

  production:
    name: deploy promoted SHA
    needs: promote
    if: needs.promote.result == 'success'
    uses: ./.github/workflows/deploy-production.yml
    with:
      candidate_sha: ${{ needs.promote.outputs.candidate_sha }}
      ci_run_id: ${{ needs.promote.outputs.ci_run_id }}
      promotion_run_id: ${{ needs.promote.outputs.promotion_run_id }}
    permissions:
      contents: read
      actions: read
    secrets: inherit

  report-success:
    name: record successful production deployment
    needs:
      - promote
      - production
    if: >-
      needs.promote.result == 'success' &&
      needs.production.result == 'success' &&
      needs.production.outputs.deployment_status == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Record successful promotion summary
        env:
          CANDIDATE_SHA: ${{ needs.promote.outputs.candidate_sha }}
          PROMOTION_RUN_ID: ${{ needs.promote.outputs.promotion_run_id }}
          REQUESTED_BY: ${{ needs.promote.outputs.requested_by }}
        shell: bash
        run: |
          printf 'Production deployment succeeded.\n\n- candidate: `%s`\n- promotion run: `%s`\n- requested by: `%s`\n' \
            "$CANDIDATE_SHA" "$PROMOTION_RUN_ID" "$REQUESTED_BY" >> "$GITHUB_STEP_SUMMARY"

  report-failure:
    name: report deployment failure
    needs:
      - promote
      - production
    if: >-
      always() &&
      needs.promote.result == 'success' &&
      (needs.production.result != 'success' ||
       needs.production.outputs.deployment_status != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Record resume parameters
        env:
          CANDIDATE_SHA: ${{ needs.promote.outputs.candidate_sha }}
          CI_RUN_ID: ${{ needs.promote.outputs.ci_run_id }}
          PROMOTION_RUN_ID: ${{ needs.promote.outputs.promotion_run_id }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
          DEPLOYMENT_STATUS: ${{ needs.production.outputs.deployment_status }}
        shell: bash
        run: |
          {
            printf 'Production deployment did not complete; deploy remains frozen for Resume deploy.\n\n'
            printf -- '- candidate_sha: `%s`\n' "$CANDIDATE_SHA"
            printf -- '- ci_run_id: `%s`\n' "$CI_RUN_ID"
            printf -- '- promotion_run_id: `%s`\n' "$PROMOTION_RUN_ID"
            printf -- '- production job: `%s`\n' "$PRODUCTION_RESULT"
            printf -- '- deployment status: `%s`\n' "${DEPLOYMENT_STATUS:-unset}"
          } >> "$GITHUB_STEP_SUMMARY"
