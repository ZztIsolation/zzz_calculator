name: Resume deploy

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Frozen SHA currently pointed to by deploy
        required: true
        type: string
      ci_run_id:
        description: Successful main CI run that produced the candidate artifact
        required: true
        type: string
      promotion_run_id:
        description: Original owner-dispatched Promote deploy run that advanced deploy
        required: true
        type: string
      confirm_production:
        description: Confirm resuming production deployment for the frozen deploy SHA
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-promotion-write
  cancel-in-progress: false

jobs:
  validate:
    name: validate frozen candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.validate.outputs.candidate_sha }}
      ci_run_id: ${{ steps.validate.outputs.ci_run_id }}
      promotion_run_id: ${{ steps.validate.outputs.promotion_run_id }}
      artifact_name: ${{ steps.validate.outputs.artifact_name }}
      promotion_run_url: ${{ steps.validate.outputs.promotion_run_url }}
      fast_forward_job_id: ${{ steps.validate.outputs.fast_forward_job_id }}
    steps:
      - name: Validate explicit resume request, promotion run, CI, and artifact
        id: validate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PRODUCTION_CD_ENABLED: ${{ vars.PRODUCTION_CD_ENABLED }}
        with:
          script: |
            const fail = message => {
              core.setFailed(message);
              return null;
            };
            const owner = context.repo.owner.toLowerCase();
            const requestedBy = (context.actor || "").toLowerCase();
            const triggeringActor = (process.env.TRIGGERING_ACTOR || "").toLowerCase();
            if (requestedBy !== owner || triggeringActor !== owner) {
              return fail("Resume deploy may only be dispatched or re-run by the repository owner.");
            }
            if (process.env.CONFIRM_PRODUCTION !== "true") {
              return fail("confirm_production must be true before resuming production CD.");
            }
            if (context.ref !== "refs/heads/deploy") {
              return fail("Resume deploy must be dispatched from deploy.");
            }
            if (process.env.PRODUCTION_CD_ENABLED !== "true") {
              return fail("Repository variable PRODUCTION_CD_ENABLED must be true before resuming production CD.");
            }

            const candidateSha = process.env.CANDIDATE_SHA;
            const runId = process.env.CI_RUN_ID;
            const promotionRunId = process.env.PROMOTION_RUN_ID;
            if (!/^[0-9a-f]{40}$/.test(candidateSha || "")) {
              return fail("candidate_sha must be a full lowercase 40-character commit SHA.");
            }
            if (!/^\d+$/.test(runId || "")) {
              return fail("ci_run_id must be numeric.");
            }
            if (!/^\d+$/.test(promotionRunId || "")) {
              return fail("promotion_run_id must be numeric.");
            }
            const numericCiRunId = Number(runId);
            const numericPromotionRunId = Number(promotionRunId);
            if (!Number.isSafeInteger(numericCiRunId) || numericCiRunId < 1
              || !Number.isSafeInteger(numericPromotionRunId) || numericPromotionRunId < 1) {
              return fail("ci_run_id and promotion_run_id must be positive safe integers.");
            }

            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const getBranch = branch => github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch,
            }).then(response => response.data);
            const deploy = await getBranch("deploy");
            if (!deploy.protected) {
              return fail("deploy must remain protected before resuming production CD.");
            }
            if (context.sha !== deploy.commit.sha) {
              return fail(`Workflow SHA ${context.sha} is not current deploy ${deploy.commit.sha}.`);
            }
            if (deploy.commit.sha !== candidateSha) {
              return fail(`deploy is ${deploy.commit.sha}, not frozen candidate ${candidateSha}.`);
            }

            const promotionRun = (await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: numericPromotionRunId,
            })).data;
            if (promotionRun.name !== "Promote deploy"
              || promotionRun.path !== ".github/workflows/promote-deploy.yml"
              || promotionRun.event !== "workflow_dispatch"
              || promotionRun.head_branch !== "main"
              || promotionRun.head_sha !== candidateSha
              || promotionRun.actor?.login?.toLowerCase() !== owner
              || promotionRun.triggering_actor?.login?.toLowerCase() !== owner
              || promotionRun.head_repository?.full_name !== repository) {
              return fail("The supplied promotion run is not an owner-dispatched and owner-triggered Promote deploy run for the frozen candidate.");
            }
            const promotionJobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: numericPromotionRunId,
                filter: "all",
                per_page: 100,
              },
            );
            const fastForwardJob = promotionJobs.find(job =>
              job.name === "promote fast-forward"
              && job.steps?.some(step =>
                step.name === "Validate explicit request and fast-forward deploy"
                && step.conclusion === "success"));
            if (!fastForwardJob) {
              return fail("The supplied promotion run has no successful deploy fast-forward step.");
            }

            const run = (await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: numericCiRunId,
            })).data;
            if (run.name !== "CI"
              || run.path !== ".github/workflows/ci.yml"
              || !["push", "workflow_dispatch"].includes(run.event)
              || run.head_branch !== "main"
              || run.head_sha !== candidateSha
              || run.conclusion !== "success"
              || run.head_repository?.full_name !== repository) {
              return fail("The supplied run is not a successful main CI run for the frozen candidate.");
            }
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              },
            );
            const artifactName = `server-release-${candidateSha}`;
            if (!artifacts.some(artifact =>
              artifact.name === artifactName
              && !artifact.expired
              && artifact.size_in_bytes > 0)) {
              return fail(`The exact candidate artifact ${artifactName} is missing, empty, or expired.`);
            }

            const finalDeploy = await getBranch("deploy");
            if (finalDeploy.commit.sha !== candidateSha || !finalDeploy.protected) {
              return fail(`deploy advanced to ${finalDeploy.commit.sha} during resume validation.`);
            }
            core.setOutput("candidate_sha", candidateSha);
            core.setOutput("ci_run_id", String(run.id));
            core.setOutput("promotion_run_id", String(promotionRun.id));
            core.setOutput("artifact_name", artifactName);
            core.setOutput("promotion_run_url", promotionRun.html_url);
            core.setOutput("fast_forward_job_id", String(fastForwardJob.id));
            await core.summary
              .addHeading("Resume production deployment")
              .addRaw(`Validated frozen deploy ${candidateSha}, main CI run ${run.id}, and ${artifactName}.`)
              .addRaw(` Original promotion: ${promotionRun.html_url}; fast-forward job: ${fastForwardJob.id}.`)
              .write();

  production:
    name: resume production deployment
    needs: validate
    if: needs.validate.result == 'success'
    uses: ./.github/workflows/deploy-production.yml
    with:
      candidate_sha: ${{ needs.validate.outputs.candidate_sha }}
      ci_run_id: ${{ needs.validate.outputs.ci_run_id }}
      promotion_run_id: ${{ needs.validate.outputs.promotion_run_id }}
    permissions:
      contents: read
      actions: read
    secrets: inherit

  report:
    name: record resume result
    needs:
      - validate
      - production
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Record resume evidence and summary
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          REQUESTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          REQUESTED_CI_RUN_ID: ${{ inputs.ci_run_id }}
          REQUESTED_PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
          DEPLOYMENT_STATUS: ${{ needs.production.outputs.deployment_status }}
          VALIDATED_CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
          VALIDATED_CI_RUN_ID: ${{ needs.validate.outputs.ci_run_id }}
          VALIDATED_PROMOTION_RUN_ID: ${{ needs.validate.outputs.promotion_run_id }}
          ARTIFACT_NAME: ${{ needs.validate.outputs.artifact_name }}
          PROMOTION_RUN_URL: ${{ needs.validate.outputs.promotion_run_url }}
          FAST_FORWARD_JOB_ID: ${{ needs.validate.outputs.fast_forward_job_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const succeeded = process.env.VALIDATION_RESULT === "success"
              && process.env.PRODUCTION_RESULT === "success"
              && process.env.DEPLOYMENT_STATUS === "success";
            const evidence = {
              schemaVersion: 1,
              repository: `${context.repo.owner}/${context.repo.repo}`,
              event: context.eventName,
              requestedBy: context.actor,
              triggeringActor: process.env.TRIGGERING_ACTOR,
              resumeWorkflowRunId: context.runId,
              resumeWorkflowRunAttempt: Number(process.env.RUN_ATTEMPT),
              confirmed: process.env.CONFIRM_PRODUCTION === "true",
              requestedCandidateSha: process.env.REQUESTED_CANDIDATE_SHA,
              requestedCiRunId: process.env.REQUESTED_CI_RUN_ID,
              requestedPromotionRunId: process.env.REQUESTED_PROMOTION_RUN_ID,
              validatedCandidateSha: process.env.VALIDATED_CANDIDATE_SHA,
              validatedCiRunId: process.env.VALIDATED_CI_RUN_ID,
              validatedPromotionRunId: process.env.VALIDATED_PROMOTION_RUN_ID,
              promotionRunUrl: process.env.PROMOTION_RUN_URL,
              fastForwardJobId: process.env.FAST_FORWARD_JOB_ID,
              artifactName: process.env.ARTIFACT_NAME,
              validationResult: process.env.VALIDATION_RESULT,
              productionResult: process.env.PRODUCTION_RESULT,
              deploymentStatus: process.env.DEPLOYMENT_STATUS || "unset",
              status: succeeded ? "success" : "failure",
              recordedAt: new Date().toISOString(),
            };
            fs.writeFileSync(
              path.join(process.env.RUNNER_TEMP_DIR, "resume-evidence.json"),
              `${JSON.stringify(evidence, null, 2)}\n`,
              { encoding: "utf8", mode: 0o600 },
            );
            const detail = succeeded
              ? "Production resume completed successfully."
              : `Production resume did not complete (validation=${process.env.VALIDATION_RESULT}, job=${process.env.PRODUCTION_RESULT}, status=${process.env.DEPLOYMENT_STATUS || "unset"}).`;
            const candidateLabel = process.env.VALIDATED_CANDIDATE_SHA || "not validated";
            const promotionLabel = process.env.VALIDATED_PROMOTION_RUN_ID || "not validated";
            await core.summary
              .addHeading("Resume deploy result")
              .addRaw(detail)
              .addRaw(` Candidate: ${candidateLabel}. Promotion run: ${promotionLabel}.`)
              .write();

      - name: Upload resume evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-resume-${{ github.run_id }}
          path: ${{ runner.temp }}/resume-evidence.json
          if-no-files-found: error
          retention-days: 14
