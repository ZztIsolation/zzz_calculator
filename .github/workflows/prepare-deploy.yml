name: Prepare deploy promotion

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  prepare:
    name: open or refresh approval PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-promotion-write
      cancel-in-progress: false
    steps:
      - name: Validate current main and prepare promotion PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const fail = message => {
              core.setFailed(message);
              return null;
            };
            if (context.ref !== "refs/heads/main") {
              return fail("Prepare deploy promotion must be dispatched from main.");
            }

            const getBranch = branch => github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch,
            }).then(response => response.data);
            const [main, deploy] = await Promise.all([
              getBranch("main"),
              getBranch("deploy"),
            ]);
            if (!main.protected || !deploy.protected) {
              return fail("Both main and deploy must be protected before preparing a promotion.");
            }
            if (context.sha !== main.commit.sha) {
              return fail(`Workflow SHA ${context.sha} is not current main ${main.commit.sha}.`);
            }
            if (deploy.commit.sha === main.commit.sha) {
              return fail("deploy already points at current main; there is nothing to promote.");
            }

            const comparison = (await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: deploy.commit.sha,
              head: main.commit.sha,
            })).data;
            if (comparison.status !== "ahead" || comparison.ahead_by < 1) {
              return fail("Current main is not a fast-forward descendant of deploy.");
            }

            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              branch: "main",
              head_sha: main.commit.sha,
              status: "success",
              per_page: 100,
            });
            const run = runs.data.workflow_runs.find(candidate =>
              candidate.name === "CI"
              && candidate.path === ".github/workflows/ci.yml"
              && ["push", "workflow_dispatch"].includes(candidate.event)
              && candidate.head_branch === "main"
              && candidate.head_sha === main.commit.sha
              && candidate.conclusion === "success"
              && candidate.head_repository?.full_name === repository
            );
            if (!run) {
              return fail(`No successful main CI run exists for ${main.commit.sha}.`);
            }

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              },
            );
            const artifactName = `server-release-${main.commit.sha}`;
            const artifact = artifacts.find(candidate =>
              candidate.name === artifactName
              && !candidate.expired
              && candidate.size_in_bytes > 0
            );
            if (!artifact) {
              return fail(`The exact main CI artifact ${artifactName} is missing, empty, or expired.`);
            }

            const [latestMain, latestDeploy] = await Promise.all([
              getBranch("main"),
              getBranch("deploy"),
            ]);
            if (latestMain.commit.sha !== main.commit.sha
              || latestDeploy.commit.sha !== deploy.commit.sha
              || !latestMain.protected
              || !latestDeploy.protected) {
              return fail("main or deploy changed while preparing the promotion; run the workflow again.");
            }

            const title = `Promote ${main.commit.sha.slice(0, 12)} to production`;
            const body = [
              "This pull request is the approval record for a non-forced fast-forward promotion.",
              "",
              `Candidate: ${main.commit.sha}`,
              `Current deploy base: ${deploy.commit.sha}`,
              `Successful main CI run: ${run.html_url}`,
              `Artifact: ${artifactName}`,
              "",
              "Approve this PR, then dispatch **Promote deploy** from `main` with this PR number.",
              "Do not merge this PR in the GitHub UI.",
            ].join("\n");
            const existing = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              base: "deploy",
              head: `${context.repo.owner}:main`,
              per_page: 100,
            });
            if (existing.length > 1) {
              return fail("Multiple open main-to-deploy promotion PRs exist; close duplicates before retrying.");
            }

            let pullRequest;
            if (existing.length === 1) {
              pullRequest = existing[0];
              if (pullRequest.head?.repo?.full_name !== repository
                || pullRequest.head?.ref !== "main"
                || pullRequest.base?.ref !== "deploy") {
                return fail("The existing promotion PR does not match the in-repository main-to-deploy contract.");
              }
              pullRequest = (await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullRequest.number,
                title,
                body,
              })).data;
              core.notice(`Refreshed promotion PR #${pullRequest.number}: ${pullRequest.html_url}`);
            } else {
              pullRequest = (await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                head: "main",
                base: "deploy",
                body,
                maintainer_can_modify: false,
              })).data;
              core.notice(`Created promotion PR #${pullRequest.number}: ${pullRequest.html_url}`);
            }

            await core.summary
              .addHeading("Deploy promotion approval")
              .addLink(`PR #${pullRequest.number}`, pullRequest.html_url)
              .addRaw(` tracks main ${main.commit.sha}, CI run ${run.id}, and ${artifactName}.`)
              .write();
