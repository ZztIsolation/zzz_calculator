name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install webapp dependencies
        run: npm --prefix webapp ci

      - name: Validate deployment shell policy
        run: |
          bash -n deploy/production/bootstrap-zzz-calculator-deploy.sh
          bash -n deploy/production/zzz-calculator-deploy
          bash -n tests/production-bootstrap.integration.sh
          bash -n tests/production-deploy-manager.integration.sh
          sudo visudo -cf deploy/production/zzz-calculator-deploy.sudoers

      - name: Run deployment bootstrap integration tests
        run: bash tests/production-bootstrap.integration.sh

      - name: Run deployment manager integration tests
        run: bash tests/production-deploy-manager.integration.sh

      - name: Run regression suite
        run: npm test

      - name: Build Vue application
        run: npm run build:webapp

      - name: Install Chromium for layout tests
        working-directory: webapp
        run: npx playwright install --with-deps chromium

      - name: Run browser layout regression suite
        run: npm run test:layout

      # Keep the repository's packaging command as a required verification. It
      # binds the artifact to the exact clean checkout SHA.
      - name: Build server release
        run: npm run build:server

      # build:server invokes Vite with its normal build flags. Rebuild Pages
      # with its own maintenance flag so stale maintenance chunks cannot leak
      # into the default production tree, then emit final evidence from the
      # exact tree uploaded to production CD.
      - name: Finalize Pages tree and release evidence
        run: |
          npm run build:pages
          node scripts/package-server-release.js

      - name: Validate deployment configuration
        run: node scripts/validate-deployment-config.js

      - name: Upload immutable main release artifact
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: server-release-${{ github.sha }}
          path: |
            output/zzz-calculator-server-*.tar.gz
            output/zzz-calculator-server-*.evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            output/playwright
          if-no-files-found: ignore
          retention-days: 14
